# Machine-readable nginx / webserver mitigation catalog (tier-5 HTTP).
# Sources: nginx CHANGES Security, CWE/CAPEC, Envoy/Apache hardening guides.
# Run: python3 scripts/audit-nginx-mitigations.py (lic) to refresh stubs.

[[mitigation]]
id = "duplicate_content_length"
cve = ["CVE-2019-20372"]
nginx_version_fixed = "1.17.7"
notes = "Reject duplicate Content-Length"
exploit = "exploits/duplicate_content_length.toml"
li_invariant = "single parser rejects duplicate Content-Length"
li_done = true

[[mitigation]]
id = "client_header_timeout"
cve = []
notes = "slowloris — client_header_timeout / client_body_timeout"
exploit = "exploits/slowloris.toml"
li_invariant = "partial headers cannot hold slot forever"
li_done = true

