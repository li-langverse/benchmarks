[schema]
migration = "schema/realtime-channel-v1.sql"
postgres_min_version = "15"

[engines]
lidb = "lis db start --profile audit-min"
postgres = "psql"

[load]
warmup_iters = 50
measure_iters = 500
clients = 8

[targets]
threshold_ratio_vs_postgres = 1.2

[metrics]
primary = "latency_p95"
unit = "ms"
lower_is_better = true
