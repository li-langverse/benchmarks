name = "registry_publish"

[workload]
# Single-transaction publish: publisher ensure + package + version + attestation.
kind = "oltp_write"
statements = [
  "INSERT INTO publishers (name) VALUES ($1) ON CONFLICT (name) DO NOTHING",
  "INSERT INTO packages (name, publisher_id) SELECT $2, id FROM publishers WHERE name = $1",
  "INSERT INTO package_versions (package_id, version, proof_digest, coverage_pct, tree_digest) VALUES ($3, $4, $5, $6, $7)",
  "INSERT INTO attestations (package_version_id, kind, payload) VALUES ($8, $9, $10)",
]

[verify]
# Harness applies schema/registry-v1.sql to both engines before load.
min_rows = 1

[load]
metric = "latency_p95"
unit = "ms"
