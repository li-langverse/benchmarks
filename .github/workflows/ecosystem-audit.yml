name: Ecosystem audit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic

      - name: Ingest benchmarks (best effort)
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          ./scripts/ingest/ingest-lic.sh || python3 scripts/ingest/build_summary.py lic

      - name: Record history + audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/record-benchmark-history.py
          python3 scripts/ecosystem-audit.py

      - name: Commit audit artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "benchmarks-audit-bot"
          git config user.email "benchmarks-audit-bot@users.noreply.github.com"
          git add data/latest/ecosystem-audit.json data/history/
          if git diff --staged --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "chore(audit): ecosystem health + benchmark history snapshot"
          git push
