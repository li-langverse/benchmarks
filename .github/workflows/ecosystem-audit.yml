# Manual only — no schedule (saves Actions budget). Prefer Cursor Automations:
# .cursor/automations/ecosystem-health.md
name: Ecosystem audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          ref: dev
          path: lic

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis

      - name: Ingest + audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/ingest/*.sh
          ./scripts/ingest/ingest-lic.sh || python3 scripts/ingest/build_summary.py lic lis
          python3 scripts/record-benchmark-history.py
          python3 scripts/plan-completion-audit.py
          python3 scripts/issue-feature-triage.py || true
          python3 scripts/ecosystem-audit.py

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/li-cursor-agents
          path: li-cursor-agents

      - name: UI/UX audit preflight (mock matrix)
        env:
          LI_CURSOR_AGENTS_ROOT: ${{ github.workspace }}/li-cursor-agents
          LI_UI_AUDIT_MOCK: "1"
        run: python3 scripts/ui-ux-audit.py --preflight || true

      - name: Commit (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "benchmarks-audit-bot"
          git config user.email "benchmarks-audit-bot@users.noreply.github.com"
          git add data/latest/ecosystem-audit.json data/latest/plan-completion-audit.json data/latest/issue-feature-triage.json data/history/ 2>/dev/null || git add data/latest/ecosystem-audit.json data/history/
          git diff --staged --quiet || git commit -m "chore(audit): manual ecosystem snapshot"
          git push
