# Dispatch-only — fail if any org repo lacks ci.yml
name: Org repo CI audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/ensure-org-repo-ci.py
      - docs/ecosystem/repo-ci-required.md
      - .github/workflows/org-repo-ci-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify all org repos have ci.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ensure-org-repo-ci.py
