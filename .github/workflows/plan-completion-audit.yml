# Optional dispatch — publishes JSON artifacts only. Plan interpretation = Cursor agent plan-completion-audit.md
# Manual / dispatch — plan debt audit. No schedule (Actions budget).
# LIC_ROOT: checks out li-langverse/lic@dev beside benchmarks; local runs need sibling ../lic or export LIC_ROOT.
name: Plan completion audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          ref: dev
          path: lic

      - name: Run audits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          python3 scripts/plan-completion-audit.py
          python3 scripts/issue-feature-triage.py || true
          python3 scripts/ecosystem-audit.py

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plan-audit-${{ github.run_id }}
          path: |
            data/latest/plan-completion-audit.json
            data/latest/issue-feature-triage.json
            data/latest/ecosystem-audit.json

      - name: Commit snapshots (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "benchmarks-audit-bot"
          git config user.email "benchmarks-audit-bot@users.noreply.github.com"
          git add data/latest/plan-completion-audit.json data/latest/issue-feature-triage.json data/latest/ecosystem-audit.json
          git diff --staged --quiet || git commit -m "chore(audit): plan completion + issue triage snapshot"
          git push
