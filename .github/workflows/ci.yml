name: Benchmarks CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ingest-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18-dev zlib1g-dev libzstd-dev python3

      - name: Build lic
        env:
          LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
          CC: clang-18
        run: cd lic && ./scripts/build.sh

      - name: Ingest (Li summary + Python fallback)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          ./scripts/ingest/ingest-lic.sh

      - name: Summary compare gate (fixture)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: ./scripts/ingest/summary-compare-gate.sh

      - run: test -f data/latest/summary.json

  # Pages deploy uses Vite (pages.yml) until lic main ships std/plot (PH-IO-5).
  dashboard-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build Vite dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Verify Pages artifact path
        run: test -s dashboard/dist/index.html
