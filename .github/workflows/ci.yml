name: Benchmarks CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ingest-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis

      - name: Install LLVM 22
        run: |
          chmod +x lic/scripts/ci-install-llvm.sh
          sudo LI_LLVM_MAJOR=22 bash lic/scripts/ci-install-llvm.sh

      - name: Build lic
        env:
          LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
          CC: clang-22
          CXX: clang++-22
        run: cd lic && ./scripts/build.sh

      - name: Ingest (Li summary + Python fallback)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          ./scripts/ingest/ingest-lic.sh

      - name: Summary compare gate (fixture)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: ./scripts/ingest/summary-compare-gate.sh

      - name: Tier-6 database bench manifests (stub)
        run: |
          chmod +x scripts/run-db-registry-bench.sh \
            scripts/run-db-graph-registry-bench.sh \
            scripts/run-db-vector-ann-bench.sh \
            scripts/run-db-gpu-speedup-bench.sh \
            scripts/run-db-full-spectrum-bench.sh
          ./scripts/run-db-registry-bench.sh
          ./scripts/run-db-graph-registry-bench.sh
          ./scripts/run-db-vector-ann-bench.sh
          ./scripts/run-db-gpu-speedup-bench.sh
          ./scripts/run-db-full-spectrum-bench.sh
          test -f data/latest/tier-db-registry.json
          test -f data/latest/tier-db-graph-registry.json
          test -f data/latest/tier-db-vector-ann.json
          test -f data/latest/tier-db-gpu-speedup.json
          test -f data/latest/tier-db-security.json
          test -f data/latest/tier-db-memory.json
          test -f data/latest/tier-db-parallel.json
          test -f data/latest/tier-db-audit.json
          test -f data/latest/tier-db-realtime.json

      - run: test -f data/latest/summary.json

  # Pages deploy builds dashboard-next on push to main (pages.yml). PRs gate here only (WP-E1 dedupe).
  dashboard-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dashboard invariants
        run: |
          python3 scripts/catalog/audit-catalog-coverage.py
          python3 scripts/check-dashboard-invariants.py
          python3 scripts/audit-dashboard-gaps.py

      - name: Summary measurement coverage (committed summary)
        run: python3 scripts/check-summary-measurement-coverage.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json
      - name: Build Next dashboard
        working-directory: dashboard-next
        run: |
          npm ci
          npm run build
          mkdir -p out/latest
          for f in summary.json release-index.json benchmark-matrix.json; do
            if [ -f "../data/latest/$f" ]; then
              cp "../data/latest/$f" out/latest/
            fi
          done
      - name: Dashboard static routes
        run: |
          chmod +x scripts/check-dashboard-static-routes.sh
          ./scripts/check-dashboard-static-routes.sh
      - name: Verify Pages artifact path
        run: test -s dashboard-next/out/index.html
