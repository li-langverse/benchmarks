name: Benchmarks CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ingest-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis

      - name: Install nginx + wrk (tier-5 HTTP oracle)
        run: sudo apt-get update && sudo apt-get install -y nginx wrk

      - name: Run tier-5 HTTP bench (vendored harness)
        run: |
          python3 vendor/lis-tier5/benchmarks/tier5_http/harness/bench_http.py --profile ci
          test -s vendor/lis-tier5/results/latest.csv

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18-dev zlib1g-dev libzstd-dev python3

      - name: Build lic
        env:
          LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
          CC: clang-18
        run: cd lic && ./scripts/build.sh

      - name: Ingest (Li summary + Python fallback)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
          LIS_VENDOR_ROOT: ${{ github.workspace }}/vendor/lis-tier5
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          ./scripts/ingest/ingest-lic.sh
          python3 -c "
          import json
          d=json.load(open('data/latest/summary.json'))
          http=d.get('categories',{}).get('http',{}).get('charts',[])
          assert any(c.get('series') for c in http), 'http charts need nginx rps series'
          "

      - name: Summary compare gate (fixture)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: ./scripts/ingest/summary-compare-gate.sh

      - run: test -f data/latest/summary.json

  # Pages deploy uses Vite (pages.yml) until lic main ships std/plot (PH-IO-5).
  dashboard-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Build Vite dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
      - name: Verify Pages artifact path
        run: test -s dashboard/dist/index.html
