name: Benchmarks CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ingest-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18-dev zlib1g-dev libzstd-dev python3

      - name: Build lic
        env:
          LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
          CC: clang-18
        run: cd lic && ./scripts/build.sh

      - name: Ingest (Li summary + Python fallback)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          ./scripts/ingest/ingest-lic.sh

      - name: Summary compare gate (fixture)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: ./scripts/ingest/summary-compare-gate.sh

      - run: test -f data/latest/summary.json

  dashboard-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18-dev zlib1g-dev libzstd-dev python3
      - run: |
          export LLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm CC=clang-18
          cd lic && ./scripts/build.sh
          cd "$GITHUB_WORKSPACE"
          chmod +x scripts/ingest/*.sh scripts/dashboard/*.sh scripts/regression-check.sh
      - name: Ingest
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: ./scripts/ingest/ingest-lic.sh
      - name: Render static dashboard
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: ./scripts/dashboard/render-static.sh
