name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "scripts/dashboard/**"
      - "data/latest/**"
      - "static-dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install and build Vite dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build
          mkdir -p dist/latest
          cp ../data/latest/summary.json dist/latest/

      - name: Verify Pages artifact
        run: test -s dashboard/dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
