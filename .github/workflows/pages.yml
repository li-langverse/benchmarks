name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "dashboard-next/**"
      - "scripts/dashboard/**"
      - "data/latest/**"
      - "static-dashboard/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dashboard data gates
        env:
          MULTI_OS_LINUX_ONLY: "1"
        run: |
          python3 scripts/check-reporting-platforms.py
          python3 scripts/check-summary-skip-budget.py
          python3 scripts/check-summary-measurement-quality.py
          python3 scripts/check-dashboard-invariants.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard-next/package-lock.json

      - name: Install and build Next dashboard
        working-directory: dashboard-next
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          npm ci
          npm run build
          mkdir -p out/latest
          for f in summary.json release-index.json benchmark-matrix.json; do
            if [ -f "../data/latest/$f" ]; then
              cp "../data/latest/$f" out/latest/
            fi
          done
          echo "benchmarks.lilangverse.xyz" > out/CNAME

      - name: Dashboard static routes
        run: |
          chmod +x scripts/check-dashboard-static-routes.sh
          ./scripts/check-dashboard-static-routes.sh

      - name: Verify Pages artifact
        run: test -s dashboard-next/out/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard-next/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
