name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "scripts/dashboard/**"
      - "data/latest/**"
      - "static-dashboard/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout lic (std/plot)
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 llvm-18-dev zlib1g-dev libzstd-dev

      - name: Build lic
        env:
          LLVM_DIR: /usr/lib/llvm-18/lib/cmake/llvm
          CC: clang-18
        run: |
          cd lic
          ./scripts/build.sh

      - name: Ingest summary
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          chmod +x scripts/ingest/*.sh scripts/dashboard/*.sh scripts/regression-check.sh
          ./scripts/ingest/ingest-lic.sh

      - name: Render static dashboard (PH-IO-5)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: ./scripts/dashboard/render-static.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-dashboard

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
