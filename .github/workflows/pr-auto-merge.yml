# Merge PRs labeled `merge-approved` when all gates pass (CI, review, standards).
# Reviewer workflow: standards review → add label `merge-approved` → this workflow merges.
# No schedule (Actions budget). For org-wide sweep use Cursor: pr-auto-merge.md
name: PR auto-merge (merge-approved)

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number (defaults to triggering PR on pull_request events)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-auto-merge-${{ github.event.pull_request.number || github.event.inputs.pr_number }}-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'merge-approved')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install gh (preinstalled on GHA)
        run: gh --version

      - name: Evaluate merge gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          set -euo pipefail
          PR="${PR_NUMBER:?missing PR number}"
          python3 scripts/pr-merge-gate.py \
            --repo "${{ github.repository }}" \
            --pr "$PR" \
            --json > gate.json || true
          python3 - <<'PY'
          import json, os
          data = json.load(open("gate.json"))
          r = data["results"][0]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ready={'true' if r['ready'] else 'false'}\n")
              f.write(f"url={r['url']}\n")
              blockers = "; ".join(r.get("blockers") or [])
              f.write(f"blockers={blockers}\n")
          print(json.dumps(r, indent=2))
          if not r["ready"]:
              print("::warning::Merge gate not satisfied — see blockers above")
          PY

      - name: Merge PR (squash)
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
        run: |
          python3 scripts/pr-auto-merge.py \
            --repo "${{ github.repository }}" \
            --pr "$PR_NUMBER" \
            --execute \
            --method squash

      - name: Comment on blocked merge
        if: steps.gate.outputs.ready != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "## Merge gate — not ready

          Label \`merge-approved\` is set but automated merge is **blocked**:

          ${{ steps.gate.outputs.blockers }}

          Fix CI, obtain \`APPROVED\` review, release notes, and plan labels; push fixes or re-add the label."
