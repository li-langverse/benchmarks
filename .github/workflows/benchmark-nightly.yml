# Daily multi-OS benchmark run → ingest catalog-aligned summary → refresh Pages data.
# Linux: one parallel job per tier (wall clock ≈ slowest tier). macOS/Windows: tier1 + tier2-md in parallel.
name: Benchmark nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      skip_exploits:
        description: Skip tier-5 HTTP exploit harness
        type: boolean
        default: false
      bench_profile:
        description: "fast = ~10–15m wall clock; full = slower, more oracles/scenarios"
        type: choice
        options:
          - fast
          - full
        default: fast

permissions:
  contents: write

concurrency:
  group: benchmark-nightly
  cancel-in-progress: false

env:
  LIC_BENCH_REF: main
  # Shared nightly timing (overridden when bench_profile=full on dispatch).
  BENCH_RUNS: "3"
  BENCH_MIN_RUNS: "6"
  BENCH_ADAPTIVE_RUNS: "1"
  BENCH_SUBSEC_MIN_RUNS: "8"
  HTTP_BENCH_RUNS: "3"

jobs:
  prepare-lic-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - name: Install LLVM 22 and bench deps
        run: |
          chmod +x lic/scripts/ci-install-llvm.sh
          sudo LI_LLVM_MAJOR=22 bash lic/scripts/ci-install-llvm.sh
      - uses: actions/cache@v4
        id: lic-build-cache
        with:
          path: lic/build
          key: lic-build-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-
      - name: Build lic + li-httpd
        if: steps.lic-build-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/*.sh lic/scripts/*.sh
          ./scripts/setup-lic-for-bench.sh
      - name: Verify lic build
        run: test -x lic/build/compiler/lic/lic && test -x lic/build/li-httpd

  prepare-lic-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - name: Install LLVM 22 (macOS)
        run: |
          brew install llvm@22
          llvm_prefix="$(brew --prefix llvm@22)"
          echo "LLVM_DIR=${llvm_prefix}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLVM22_PREFIX=${llvm_prefix}" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        id: lic-build-cache
        with:
          path: lic/build
          key: lic-build-macos-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-macos-
      - name: Build lic (macOS)
        if: steps.lic-build-cache.outputs.cache-hit != 'true'
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          llvm_prefix="${LLVM22_PREFIX:-$(brew --prefix llvm@22)}"
          chmod +x scripts/*.sh lic/scripts/*.sh
          export LLVM_DIR="${LLVM_DIR}"
          export PATH="${llvm_prefix}/bin:${PATH}"
          export CC="${llvm_prefix}/bin/clang"
          export CXX="${llvm_prefix}/bin/clang++"
          ./scripts/setup-lic-for-bench.sh
      - name: Verify lic build
        run: test -x lic/build/compiler/lic/lic

  prepare-lic-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-clang
      - name: Resolve LLVM (MSYS2 UCRT64)
        run: |
          set -euo pipefail
          echo "LLVM_DIR=/ucrt64/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Patch lic for MSYS2 Windows build
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          set -euo pipefail
          chmod +x scripts/patch-lic-msys-windows.sh
          ./scripts/patch-lic-msys-windows.sh
      - uses: actions/cache@v4
        id: lic-build-cache
        with:
          path: lic/build
          key: lic-build-windows-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-windows-
      - name: Build lic (Windows)
        if: steps.lic-build-cache.outputs.cache-hit != 'true'
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          MSYSTEM: UCRT64
        run: |
          set -euo pipefail
          export LLVM_DIR="${LLVM_DIR:-/ucrt64/lib/cmake/llvm}"
          export CC=clang CXX=clang++
          export PATH="/ucrt64/bin:$PATH"
          chmod +x scripts/*.sh lic/scripts/*.sh
          ./scripts/setup-lic-for-bench.sh
      - name: Verify lic build
        run: test -x lic/build/compiler/lic/lic.exe -o -x lic/build/compiler/lic/lic

  bench-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux_groups: ${{ steps.groups.outputs.linux_groups }}
    steps:
      - id: groups
        run: |
          groups='["tier0","tier1","tier2-md","tier2-pde","tier2-mech","tier7","tier3","tier5","tier5-exploits"]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.skip_exploits }}" == "true" ]]; then
            groups="$(echo "$groups" | jq 'map(select(. != "tier5-exploits"))')"
          fi
          echo "linux_groups=$groups" >> "$GITHUB_OUTPUT"

  bench-linux-tier:
    needs: [bench-matrix, prepare-lic-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        group: ${{ fromJSON(needs.bench-matrix.outputs.linux_groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - name: Apply bench profile env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.bench_profile }}" == "full" ]]; then
            echo "BENCH_HTTP_PROFILE=nightly" >> "$GITHUB_ENV"
            echo "BENCH_HTTP_ORACLES=nginx,apache,lighttpd,node,bun,li" >> "$GITHUB_ENV"
            echo "BENCH_RUNS=6" >> "$GITHUB_ENV"
            echo "BENCH_MIN_RUNS=20" >> "$GITHUB_ENV"
            echo "HTTP_BENCH_RUNS=6" >> "$GITHUB_ENV"
            echo "TIER5_EXPLOIT_PROFILE=pr" >> "$GITHUB_ENV"
          else
            echo "BENCH_HTTP_PROFILE=nightly-fast" >> "$GITHUB_ENV"
            echo "BENCH_HTTP_ORACLES=nginx,li" >> "$GITHUB_ENV"
            echo "BENCH_HTTP_QUICK_SEC=3" >> "$GITHUB_ENV"
            echo "TIER5_EXPLOIT_PROFILE=nightly-fast" >> "$GITHUB_ENV"
          fi
      - uses: actions/cache@v4
        with:
          path: lic/build
          key: lic-build-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-
      - name: Setup tier deps ${{ matrix.group }}
        env:
          SKIP_BUILD: "1"
        run: |
          chmod +x scripts/ci-setup-lic-nightly-linux.sh
          ./scripts/ci-setup-lic-nightly-linux.sh ${{ matrix.group }}
      - name: Run tier group ${{ matrix.group }}
        env:
          SKIP_EXPLOITS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_exploits == true && '1' || '0' }}
          SKIP_BUILD: "1"
        run: |
          chmod +x scripts/*.sh scripts/ingest/*.sh
          ./scripts/run-benchmark-ci-nightly.sh tier ${{ matrix.group }}
      - name: Upload tier CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-tier-${{ matrix.group }}
          path: results/tier-${{ matrix.group }}.csv
          if-no-files-found: error
      - name: Upload tier5 HTTP sidecars
        if: matrix.group == 'tier5'
        uses: actions/upload-artifact@v4
        with:
          name: bench-tier5-sidecars
          path: |
            vendor/lis-tier5/results/latest.csv
            lic/benchmarks/results/http_tier5.csv
          if-no-files-found: warn

  bench-linux-merge:
    needs: bench-linux-tier
    if: needs.bench-linux-tier.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/tiers
          pattern: bench-tier-*
          merge-multiple: true
      - name: Collect tier CSV shards
        run: |
          chmod +x scripts/collect-tier-csv-artifacts.sh
          ./scripts/collect-tier-csv-artifacts.sh artifacts/tiers results
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-tier5-sidecars
          path: .
      - name: Merge tier shards
        run: |
          chmod +x scripts/*.sh
          ./scripts/merge-benchmark-tier-csvs.sh results
          test -s results/latest.csv
      - name: Upload Linux CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-linux
          path: results/latest.csv
          if-no-files-found: error

  bench-macos-tier:
    needs: prepare-lic-macos
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [tier1, tier2-md]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - name: Install LLVM 22 (macOS)
        run: |
          brew install llvm@22
          llvm_prefix="$(brew --prefix llvm@22)"
          test -f "${llvm_prefix}/lib/cmake/llvm/LLVMConfig.cmake"
          echo "LLVM_DIR=${llvm_prefix}/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLVM22_PREFIX=${llvm_prefix}" >> "$GITHUB_ENV"
          "${llvm_prefix}/bin/clang" --version
      - uses: actions/cache@v4
        id: lic-build-cache
        with:
          path: lic/build
          key: lic-build-macos-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-macos-
      - name: Verify lic (macOS)
        run: test -x lic/build/compiler/lic/lic
      - name: Run tier ${{ matrix.group }} (macOS)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
          SKIP_BUILD: "1"
          SKIP_TIER5_HTTP: "1"
          SKIP_EXPLOITS: "1"
        run: |
          llvm_prefix="${LLVM22_PREFIX:-$(brew --prefix llvm@22)}"
          export PATH="${llvm_prefix}/bin:${PATH}"
          chmod +x scripts/*.sh
          ./scripts/run-benchmark-ci-nightly.sh tier ${{ matrix.group }}
      - name: Upload macOS tier CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-macos-${{ matrix.group }}
          path: results/tier-${{ matrix.group }}.csv
          if-no-files-found: error

  bench-macos-merge:
    needs: bench-macos-tier
    if: needs.bench-macos-tier.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/tiers
          pattern: bench-macos-*
          merge-multiple: true
      - name: Finalize macOS CSV
        env:
          EXPECT_OS: macos
        run: |
          chmod +x scripts/*.sh
          mkdir -p results
          ./scripts/collect-tier-csv-artifacts.sh artifacts/tiers results
          ./scripts/finalize-nightly-os-csv.sh results
      - name: Upload macOS CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-macos
          path: results/latest.csv
          if-no-files-found: error

  bench-windows-tier:
    needs: prepare-lic-windows
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: [tier1, tier2-md]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-clang
      - name: Resolve LLVM (MSYS2 UCRT64)
        run: |
          set -euo pipefail
          test -f /ucrt64/lib/cmake/llvm/LLVMConfig.cmake
          echo "LLVM_DIR=/ucrt64/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "/ucrt64/bin" >> "$GITHUB_PATH"
          clang --version
      - name: Patch lic for MSYS2 Windows build
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          chmod +x scripts/patch-lic-msys-windows.sh
          ./scripts/patch-lic-msys-windows.sh
      - uses: actions/cache@v4
        id: lic-build-cache
        with:
          path: lic/build
          key: lic-build-windows-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-windows-
      - name: Verify lic (Windows)
        run: test -x lic/build/compiler/lic/lic.exe -o -x lic/build/compiler/lic/lic
      - name: Run tier ${{ matrix.group }} (Windows)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
          MSYSTEM: UCRT64
          SKIP_BUILD: "1"
          SKIP_TIER5_HTTP: "1"
          SKIP_EXPLOITS: "1"
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export LLVM_DIR="${LLVM_DIR:-/ucrt64/lib/cmake/llvm}"
          export PATH="/ucrt64/bin:$PATH"
          chmod +x scripts/*.sh
          ./scripts/run-benchmark-ci-nightly.sh tier ${{ matrix.group }}
      - name: Upload Windows tier CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-windows-${{ matrix.group }}
          path: results/tier-${{ matrix.group }}.csv
          if-no-files-found: error

  bench-windows-merge:
    needs: bench-windows-tier
    if: needs.bench-windows-tier.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/tiers
          pattern: bench-windows-*
          merge-multiple: true
      - name: Finalize Windows CSV
        env:
          EXPECT_OS: windows
        run: |
          chmod +x scripts/*.sh
          mkdir -p results
          ./scripts/collect-tier-csv-artifacts.sh artifacts/tiers results
          ./scripts/finalize-nightly-os-csv.sh results
      - name: Upload Windows CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-windows
          path: results/latest.csv
          if-no-files-found: error

  publish-dashboard:
    needs: [bench-linux-merge, bench-macos-merge, bench-windows-merge]
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.bench-linux-merge.result == 'success' &&
      needs.bench-macos-merge.result == 'success' &&
      needs.bench-windows-merge.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: ${{ env.LIC_BENCH_REF }}
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: bench-csv-linux
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-csv-macos
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-csv-windows
          path: artifacts/windows
      - name: Merge per-OS CSV and ingest
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          args=(artifacts/linux/latest.csv)
          test -f artifacts/macos/latest.csv
          test -f artifacts/windows/latest.csv
          python3 scripts/ingest/merge_bench_csv_artifacts.py \
            "$GITHUB_WORKSPACE/results/latest.csv" \
            linux:"${args[0]}" \
            macos:artifacts/macos/latest.csv \
            windows:artifacts/windows/latest.csv
          python3 scripts/check-merged-multi-os-csv.py "$GITHUB_WORKSPACE/results/latest.csv"
          ./scripts/ingest/ingest-lic.sh
          python3 scripts/check-summary-multi-os-measured.py
          python3 scripts/benchmark-matrix-report.py
          python3 scripts/record-benchmark-history.py || true
          ./scripts/regression-check.sh || true
      - name: Dashboard invariants
        env:
          MEASUREMENT_STRICT_PARITY: "1"
          MULTI_OS_STRICT: "1"
        run: |
          python3 scripts/check-reporting-platforms.py
          python3 scripts/check-summary-skip-budget.py
          python3 scripts/check-summary-measurement-quality.py
          python3 scripts/check-dashboard-invariants.py
          python3 scripts/check-summary-measurement-coverage.py || true
          python3 scripts/check-summary-multi-os-measured.py
          python3 scripts/check-zero-missing-data.py
      - name: Commit dashboard data
        run: |
          git config user.name "benchmarks-nightly"
          git config user.email "benchmarks-nightly@users.noreply.github.com"
          git add data/latest/summary.json data/latest/benchmark-matrix.json data/latest/catalog-audit.json             data/latest/release-index.json data/history/ data/latest/summary-content-hash.txt || true
          git diff --staged --quiet || git commit -m "chore(nightly): refresh benchmark summary from multi-OS run"
      - name: Push to main
        run: git push
