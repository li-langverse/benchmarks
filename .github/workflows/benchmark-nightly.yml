# Daily multi-OS benchmark run → ingest catalog-aligned summary → refresh Pages data.
name: Benchmark nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      skip_exploits:
        description: Skip tier-5 HTTP exploit harness
        type: boolean
        default: false
      parallel_linux_tiers:
        description: Run Linux tiers as parallel matrix jobs (faster wall clock)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: benchmark-nightly
  cancel-in-progress: false

jobs:
  setup-lic-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.parallel_linux_tiers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - name: Install LLVM 22 and bench deps
        run: |
          chmod +x lic/scripts/ci-install-llvm.sh
          sudo LI_LLVM_MAJOR=22 bash lic/scripts/ci-install-llvm.sh
      - uses: actions/cache@v4
        id: lic-build-cache
        with:
          path: lic/build
          key: lic-build-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-
      - name: Build lic + li-httpd
        if: steps.lic-build-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/*.sh lic/scripts/*.sh
          ./scripts/setup-lic-for-bench.sh
      - name: Verify lic build
        run: test -x lic/build/compiler/lic/lic && test -x lic/build/li-httpd

  bench-linux-tier:
    if: github.event_name != 'workflow_dispatch' || inputs.parallel_linux_tiers
    needs: setup-lic-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [tier0, tier12, tier7, tier3, tier5, tier5-exploits]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - name: Install LLVM 22 (wrk/nginx for tier5)
        run: |
          chmod +x lic/scripts/ci-install-llvm.sh
          sudo LI_LLVM_MAJOR=22 bash lic/scripts/ci-install-llvm.sh
      - uses: actions/cache@v4
        with:
          path: lic/build
          key: lic-build-${{ hashFiles('lic/scripts/build.sh', 'lic/compiler/**/CMakeLists.txt') }}
          restore-keys: |
            lic-build-
      - name: Run tier group ${{ matrix.group }}
        env:
          SKIP_EXPLOITS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_exploits == true && '1' || '0' }}
          SKIP_BUILD: "1"
        run: |
          chmod +x scripts/*.sh scripts/ingest/*.sh
          ./scripts/run-benchmark-ci-nightly.sh tier ${{ matrix.group }}
      - name: Upload tier CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-tier-${{ matrix.group }}
          path: results/tier-${{ matrix.group }}.csv
          if-no-files-found: warn
      - name: Upload tier5 HTTP sidecars
        if: matrix.group == 'tier5'
        uses: actions/upload-artifact@v4
        with:
          name: bench-tier5-sidecars
          path: |
            vendor/lis-tier5/results/latest.csv
            lic/benchmarks/results/http_tier5.csv
          if-no-files-found: warn

  bench-linux-merge:
    if: github.event_name != 'workflow_dispatch' || inputs.parallel_linux_tiers
    needs: [setup-lic-linux, bench-linux-tier]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/tiers
          pattern: bench-tier-*
          merge-multiple: true
      - name: Collect tier CSV shards
        run: |
          mkdir -p results
          shopt -s nullglob
          for f in artifacts/tiers/**/tier-*.csv; do
            cp "$f" "results/$(basename "$f")"
          done
          ls -la results/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-tier5-sidecars
          path: .
      - name: Merge tier shards
        run: |
          chmod +x scripts/*.sh
          ./scripts/merge-benchmark-tier-csvs.sh results
          test -s results/latest.csv
      - name: Upload Linux CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-linux
          path: results/latest.csv
          if-no-files-found: error

  bench-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.parallel_linux_tiers == false
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - name: Install LLVM 22 and bench deps
        run: |
          chmod +x lic/scripts/ci-install-llvm.sh
          sudo LI_LLVM_MAJOR=22 bash lic/scripts/ci-install-llvm.sh
      - name: Run full benchmark suite (Linux)
        env:
          SKIP_EXPLOITS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_exploits == true && '1' || '0' }}
        run: |
          chmod +x scripts/*.sh scripts/ingest/*.sh
          ./scripts/run-benchmark-ci-nightly.sh
      - name: Upload Linux CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-linux
          path: results/latest.csv
          if-no-files-found: error

  bench-macos:
    runs-on: macos-14
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main
      - name: Run core benchmarks (macOS)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
          SKIP_BUILD: "0"
        run: |
          chmod +x scripts/*.sh lic/scripts/*.sh
          ./scripts/setup-lic-for-bench.sh
          ./scripts/run-benchmark-ci-nightly.sh
      - name: Upload macOS CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-macos
          path: results/latest.csv
          if-no-files-found: warn

  bench-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main
      - name: Install LLVM 22 (Windows)
        shell: bash
        run: |
          choco install llvm --version=22.1.0 -y || choco install llvm -y || true
          echo "LLVM_DIR=C:/Program Files/LLVM/lib/cmake/llvm" >> "$GITHUB_ENV"
      - name: Run core benchmarks (Windows)
        shell: bash
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-benchmark-ci-nightly.sh || true
      - name: Upload Windows CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-windows
          path: results/latest.csv
          if-no-files-found: warn

  publish-dashboard:
    needs: [bench-linux-merge, bench-linux, bench-macos, bench-windows]
    if: |
      github.ref == 'refs/heads/main' &&
      (needs.bench-linux-merge.result == 'success' || needs.bench-linux.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: bench-csv-linux
          path: artifacts/linux
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-csv-macos
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-csv-windows
          path: artifacts/windows
      - name: Merge per-OS CSV and ingest
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          args=(artifacts/linux/latest.csv)
          [[ -f artifacts/macos/latest.csv ]] && args+=(artifacts/macos/latest.csv)
          [[ -f artifacts/windows/latest.csv ]] && args+=(artifacts/windows/latest.csv)
          python3 scripts/ingest/merge_bench_csv_artifacts.py             "$GITHUB_WORKSPACE/results/latest.csv" "${args[@]}"
          ./scripts/ingest/ingest-lic.sh
          python3 scripts/benchmark-matrix-report.py
          python3 scripts/record-benchmark-history.py || true
          ./scripts/regression-check.sh || true
      - name: Dashboard invariants
        run: |
          python3 scripts/check-dashboard-invariants.py
          python3 scripts/check-summary-measurement-coverage.py || true
      - name: Commit dashboard data
        run: |
          git config user.name "benchmarks-nightly"
          git config user.email "benchmarks-nightly@users.noreply.github.com"
          git add data/latest/summary.json data/latest/benchmark-matrix.json data/latest/catalog-audit.json             data/latest/release-index.json data/history/ data/latest/summary-content-hash.txt || true
          git diff --staged --quiet || git commit -m "chore(nightly): refresh benchmark summary from multi-OS run"
      - name: Push to main
        run: git push
