# Daily multi-OS benchmark run → ingest catalog-aligned summary → refresh Pages data.
# Replaces reliance on weekly lic tier-1 smoke + optional repository_dispatch token.
name: Benchmark nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      skip_exploits:
        description: Skip tier-5 HTTP exploit harness
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmark-nightly
  cancel-in-progress: false

jobs:
  bench-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main

      - name: Install LLVM 22 and bench deps
        run: |
          chmod +x lic/scripts/ci-install-llvm.sh
          sudo LI_LLVM_MAJOR=22 bash lic/scripts/ci-install-llvm.sh

      - name: Run full benchmark suite (Linux)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
          # li-net-httpd on lic main fails E0303 (`ensures true` on value returns) until httpd contracts land.
          SKIP_HTTPD_BUILD: "1"
          SKIP_TIER5_HTTP: "1"
          BENCH_ALLOW_TIER3_FAIL: "1"
          SKIP_EXPLOITS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_exploits == true && '1' || '0' }}
        run: |
          chmod +x scripts/*.sh scripts/ingest/*.sh
          ./scripts/run-benchmark-ci-nightly.sh

      - name: Upload Linux CSV
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-linux
          path: lic/benchmarks/results/latest.csv
          if-no-files-found: error

  bench-macos:
    runs-on: macos-14
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main

      - name: Install LLVM 22 (macOS)
        run: |
          brew update
          brew install llvm@22 ninja cmake || true
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "CC=$(brew --prefix llvm@22)/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$(brew --prefix llvm@22)/bin/clang++" >> "$GITHUB_ENV"

      - name: Run core benchmarks (macOS)
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
          SKIP_BUILD: "0"
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-benchmark-ci-nightly.sh

      - name: Upload macOS CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-macos
          path: lic/benchmarks/results/latest.csv
          if-no-files-found: warn

  bench-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main

      - name: Install LLVM 22 (Windows)
        shell: bash
        run: |
          choco install llvm --version=22.1.0 -y || choco install llvm -y || true
          echo "LLVM_DIR=C:/Program Files/LLVM/lib/cmake/llvm" >> "$GITHUB_ENV"

      - name: Run core benchmarks (Windows)
        shell: bash
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-benchmark-ci-nightly.sh || true

      - name: Upload Windows CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-csv-windows
          path: lic/benchmarks/results/latest.csv
          if-no-files-found: warn

  publish-dashboard:
    needs: [bench-linux, bench-macos, bench-windows]
    if: github.ref == 'refs/heads/main' && needs.bench-linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: main

      - uses: actions/checkout@v4
        with:
          repository: li-langverse/lis
          path: lis
          ref: main

      - uses: actions/download-artifact@v4
        with:
          name: bench-csv-linux
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-csv-macos
          path: artifacts/macos

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: bench-csv-windows
          path: artifacts/windows

      - name: Merge per-OS CSV and ingest
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIS_ROOT: ${{ github.workspace }}/lis
        run: |
          chmod +x scripts/ingest/*.sh scripts/regression-check.sh
          args=(artifacts/linux/latest.csv)
          [[ -f artifacts/macos/latest.csv ]] && args+=(artifacts/macos/latest.csv)
          [[ -f artifacts/windows/latest.csv ]] && args+=(artifacts/windows/latest.csv)
          python3 scripts/ingest/merge_bench_csv_artifacts.py \
            "$LIC_ROOT/benchmarks/results/latest.csv" "${args[@]}"
          ./scripts/ingest/ingest-lic.sh
          python3 scripts/benchmark-matrix-report.py
          python3 scripts/record-benchmark-history.py || true
          ./scripts/regression-check.sh || true

      - name: Dashboard invariants
        run: |
          python3 scripts/check-dashboard-invariants.py
          python3 scripts/check-summary-measurement-coverage.py || true

      - name: Commit dashboard data
        id: commit
        run: |
          git config user.name "benchmarks-nightly"
          git config user.email "benchmarks-nightly@users.noreply.github.com"
          git add data/latest/summary.json data/latest/benchmark-matrix.md \
            data/latest/release-index.json data/history/ data/latest/summary-content-hash.txt || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(nightly): refresh benchmark summary from multi-OS run"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push nightly data PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bot/nightly-summary-${{ github.run_id }}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(nightly): refresh benchmark summary" \
            --body "Automated nightly ingest from run ${{ github.run_id }}. Merge to refresh https://li-langverse.github.io/benchmarks/ (Pages deploys on \`data/latest/**\` push to main)."
