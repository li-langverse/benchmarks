# Event-driven feature planning comment (no cron). Complements Cursor Automations.
name: Issue feature planning

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write

jobs:
  planning-comment:
    if: github.event.issue.pull_request == null
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Post planning checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/post-issue-planning-comment.py
