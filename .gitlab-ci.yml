# GitLab-primary CI for benchmarks (GitHub mirror read-only; GHCR unchanged).
# Schedule (GitLab UI → CI/CD → Schedules): cron 0 4 * * *  variable SCHEDULE_KIND=benchmark-nightly
#
# Required CI/CD variables:
#   GITLAB_TOKEN   clone lic/lis siblings
#   GHCR_TOKEN or GH_PACKAGES   optional; lic-ci image pull on runner via imagePullSecrets
#
# macOS/Windows nightly tiers: deferred (homelab-k8s is Linux). Linux tier matrix runs on schedule.

stages:
  - test
  - nightly
  - publish

default:
  tags:
    - homelab-k8s
  interruptible: true

variables:
  LIC_BENCH_REF: main
  BENCH_RUNS: "6"
  BENCH_MIN_RUNS: "6"
  BENCH_EQUALIZE_RUNS: "1"
  REGISTRY_SHARD_COUNT: "3"
  BENCH_ADAPTIVE_RUNS: "1"
  BENCH_SUBSEC_MIN_RUNS: "8"
  HTTP_BENCH_RUNS: "3"
  GIT_SSL_NO_VERIFY: "true"
  CI_SERVER_HOST: gitlab.gitlab.svc.cluster.local

.clone_siblings: &clone_siblings
  - git clone --depth 1 "http://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/li-langverse/lic.git" lic
  - git clone --depth 1 "http://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/li-langverse/lis.git" lis

.ubuntu_before: &ubuntu_before
  - apt-get update -qq
  - apt-get install -y -qq git curl ca-certificates sudo python3 lsb-release wget gnupg
    software-properties-common cmake ninja-build nodejs npm
  - chmod +x lic/scripts/ci-install-llvm.sh scripts/*.sh
  - sudo LI_LLVM_MAJOR=22 bash lic/scripts/ci-install-llvm.sh

ingest-smoke:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git curl ca-certificates sudo python3 lsb-release wget gnupg software-properties-common
    - *clone_siblings
    - *ubuntu_before
  script:
    - cd lic && ./scripts/build.sh
    - |
      export LIC_ROOT="$CI_PROJECT_DIR/lic"
      export LIS_ROOT="$CI_PROJECT_DIR/lis"
      chmod +x scripts/ingest/*.sh scripts/regression-check.sh
      ./scripts/ingest/ingest-lic.sh
    - ./scripts/ingest/summary-compare-gate.sh
    - |
      chmod +x scripts/run-db-registry-bench.sh scripts/run-db-graph-registry-bench.sh \
        scripts/run-db-vector-ann-bench.sh scripts/run-db-gpu-speedup-bench.sh \
        scripts/run-db-full-spectrum-bench.sh
      ./scripts/run-db-registry-bench.sh
      ./scripts/run-db-graph-registry-bench.sh
      ./scripts/run-db-vector-ann-bench.sh
      ./scripts/run-db-gpu-speedup-bench.sh
      ./scripts/run-db-full-spectrum-bench.sh
      test -f data/latest/tier-db-registry.json
      test -f data/latest/summary.json
    - python3 scripts/ingest/validate-gpu-contribution.py
    - python3 scripts/ingest/build-lig-gpu-matrix.py
    - test -f data/latest/lig-gpu-matrix.json
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

dashboard-build:
  stage: test
  image: node:22-bookworm
  script:
    - apt-get update -qq && apt-get install -y -qq python3
    - python3 scripts/check-reporting-platforms.py
    - python3 scripts/check-summary-skip-budget.py
    - python3 scripts/check-summary-measurement-quality.py
    - python3 scripts/catalog/audit-catalog-coverage.py
    - python3 scripts/check-dashboard-invariants.py
    - python3 scripts/audit-dashboard-gaps.py
    - python3 scripts/check-summary-measurement-coverage.py
    - cd dashboard-next && npm ci && npm run build
    - mkdir -p out/latest
    - |
      for f in summary.json release-index.json benchmark-matrix.json; do
        if [ -f "../data/latest/$f" ]; then cp "../data/latest/$f" out/latest/; fi
      done
    - cd .. && chmod +x scripts/check-dashboard-static-routes.sh && ./scripts/check-dashboard-static-routes.sh
    - test -s dashboard-next/out/index.html
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

reporting-platforms-gate:
  stage: test
  image: python:3.12-slim
  script:
    - python3 scripts/check-reporting-platforms.py
    - python3 scripts/check-summary-skip-budget.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

prepare-lic-linux:
  stage: nightly
  image: ubuntu:24.04
  timeout: 45m
  cache:
    key: lic-build-linux
    paths:
      - lic/build/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git curl ca-certificates sudo python3 lsb-release wget gnupg software-properties-common
    - *clone_siblings
    - *ubuntu_before
  script:
    - ./scripts/setup-lic-for-bench.sh
    - test -x lic/build/compiler/lic/lic && test -x lic/build/li-httpd
  artifacts:
    paths:
      - lic/build/
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "benchmark-nightly"
    - if: $CI_PIPELINE_SOURCE == "web"

.bench_tier_template: &bench_tier
  stage: nightly
  image: ubuntu:24.04
  timeout: 90m
  needs: [prepare-lic-linux]
  cache:
    key: lic-build-linux
    paths:
      - lic/build/
    policy: pull
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git python3
    - *clone_siblings
  script:
    - |
      export BENCH_HTTP_PROFILE=nightly-fast
      export BENCH_HTTP_ORACLES=nginx,li
      export BENCH_HTTP_QUICK_SEC=3
      export TIER5_EXPLOIT_PROFILE=nightly-fast
      export TIER5_EXPLOIT_LANGS=nginx,li
      export SKIP_BUILD=1
      chmod +x scripts/ci-setup-lic-nightly-linux.sh scripts/run-benchmark-ci-nightly.sh
      ./scripts/ci-setup-lic-nightly-linux.sh "$TIER_GROUP"
      ./scripts/run-benchmark-ci-nightly.sh tier "$TIER_GROUP"
  artifacts:
    paths:
      - results/tier-${TIER_GROUP}.csv
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "benchmark-nightly"
    - if: $CI_PIPELINE_SOURCE == "web"

bench-tier0:
  <<: *bench_tier
  variables:
    TIER_GROUP: tier0

bench-tier1:
  <<: *bench_tier
  variables:
    TIER_GROUP: tier1

bench-tier2-md:
  <<: *bench_tier
  variables:
    TIER_GROUP: tier2-md

bench-tier5:
  <<: *bench_tier
  variables:
    TIER_GROUP: tier5

bench-linux-merge:
  stage: nightly
  image: ubuntu:24.04
  timeout: 30m
  needs:
    - job: bench-tier0
      artifacts: true
    - job: bench-tier1
      artifacts: true
    - job: bench-tier2-md
      artifacts: true
    - job: bench-tier5
      artifacts: true
  script:
    - apt-get update -qq && apt-get install -y -qq git python3
    - mkdir -p artifacts/tiers results
    - |
      for tier in tier0 tier1 tier2-md tier5; do
        if [[ -f "results/tier-${tier}.csv" ]]; then
          cp "results/tier-${tier}.csv" "artifacts/tiers/"
        fi
      done
    - chmod +x scripts/collect-tier-csv-artifacts.sh scripts/merge-benchmark-tier-csvs.sh
    - ./scripts/collect-tier-csv-artifacts.sh artifacts/tiers results
    - ./scripts/merge-benchmark-tier-csvs.sh results
    - test -s results/latest.csv
  artifacts:
    paths:
      - results/latest.csv
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "benchmark-nightly"
    - if: $CI_PIPELINE_SOURCE == "web"

publish-dashboard:
  stage: publish
  image: ubuntu:24.04
  timeout: 45m
  needs: [bench-linux-merge]
  script:
    - apt-get update -qq && apt-get install -y -qq git python3
    - *clone_siblings
    - mkdir -p artifacts/linux
    - cp results/latest.csv artifacts/linux/latest.csv
    - |
      export LIC_ROOT="$CI_PROJECT_DIR/lic"
      export LIS_ROOT="$CI_PROJECT_DIR/lis"
      chmod +x scripts/ingest/*.sh scripts/regression-check.sh
      python3 scripts/ingest/merge_bench_csv_artifacts.py "$CI_PROJECT_DIR/results/latest.csv" linux:artifacts/linux/latest.csv
      ./scripts/ingest/ingest-lic.sh
      export MULTI_OS_SKIP_WINDOWS=1
      python3 scripts/check-summary-multi-os-measured.py
      python3 scripts/benchmark-matrix-report.py
      python3 scripts/record-benchmark-history.py || true
      ./scripts/regression-check.sh || true
    - |
      export MEASUREMENT_STRICT_PARITY=1
      export MULTI_OS_STRICT=1
      export MULTI_OS_SKIP_WINDOWS=1
      python3 scripts/check-reporting-platforms.py
      python3 scripts/check-summary-skip-budget.py
      python3 scripts/check-summary-measurement-quality.py
      python3 scripts/check-dashboard-invariants.py
      python3 scripts/check-zero-missing-data.py
    - |
      if [[ "$CI_COMMIT_BRANCH" == "main" && -n "${GITLAB_TOKEN:-}" ]]; then
        git config user.email "benchmarks-nightly@lilangverse.xyz"
        git config user.name "benchmarks-nightly"
        git add data/latest/ data/history/ || true
        git diff --staged --quiet || git commit -m "chore(nightly): refresh benchmark summary from Linux run"
        git push "https://oauth2:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_BRANCH}"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_KIND == "benchmark-nightly" && $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"
